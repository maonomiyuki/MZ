<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MZ Text Art</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>MZ Text Art Generator</h1>

      <label class="control">
        <span>画像アップロード（PNG / JPG / WEBP）</span>
        <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" />
      </label>

      <label class="control">
        <span>横文字数: <output id="colsValue">60</output></span>
        <input id="colsInput" type="range" min="20" max="120" value="60" />
      </label>

      <label class="control">
        <span>文字セット</span>
        <select id="charsetSelect">
          <option value="A">A: @%#*+=-:. </option>
          <option value="B">B: █▓▒░ </option>
          <option value="C">C: ■●◆▲*+=-:. </option>
        </select>
      </label>

      <label class="control">
        <span>色プリセット</span>
        <select id="paletteSelect">
          <option value="Green">Green</option>
          <option value="Amber">Amber</option>
          <option value="Mono">Mono</option>
        </select>
      </label>

      <section class="preview">
        <canvas id="previewCanvas" aria-label="text-art-preview"></canvas>
      </section>

      <div class="buttons">
        <button id="saveBtn" disabled>PNG保存</button>
        <button id="copyBtn" disabled>テキストコピー</button>
      </div>

      <pre id="textOutput"></pre>
    </main>

    <script src="app.js"></script>
  </body>
</html>
